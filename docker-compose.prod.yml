networks:
  internal:
    external: false
services:

  db_migrate:
    build:
      context: db
      dockerfile: migrate/Dockerfile
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PORT: ${DB_PORT:-5432}
      DB_PASSWORD_SECRET_FILE: /run/secrets/remote_db_secret
    secrets:
      - remote_db_secret

  api:
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        VERSION: ${VERSION:-0.0.1}
        POETRY_VERSION: ${POETRY_VERSION}
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      API_ENV: prod
      API_PORT: ${API_PORT}
      DATA_DIR: ${DATA_DIR}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: /run/secrets/remote_db_secret
      DB_NAME: ${DB_NAME}
      TIMEZONE: ${TIMEZONE}
      VERSION: ${VERSION:-0.0.1}
      NETWORK_PATH: /app/data/${NETWORK_FILE}
      RTT_REFRESH_TOKEN_SECRET_FILE: /run/secrets/rtt_refresh_secret
    volumes:
      - ${DATA_DIR}:/app/data
    networks:
      - internal
    secrets:
      - remote_db_secret
      - rtt_refresh_secret
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail http://localhost:$$API_PORT/hc || exit 1"]
      interval: 1s
      timeout: 1s
      retries: 100
      start_period: 0s

  client:
    depends_on:
      api:
        condition: service_healthy
    build:
      context: .
      dockerfile: client/Dockerfile.prod
      args:
        VERSION: ${VERSION:-0.0.1}
        CLIENT_PORT: ${CLIENT_PORT}
        API_HOST: ${API_HOST}
        API_PROTOCOL: ${API_PROTOCOL}
        CLIENT_HOST: ${CLIENT_HOST}
        CLIENT_PROTOCOL: ${API_PROTOCOL}
        MAPTILER_KEY: ${MAPTILER_KEY}
        POETRY_VERSION: ${POETRY_VERSION}
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    environment:
      API_URL: ${API_PROTOCOL}://${API_HOST}
      CLIENT_PORT: ${CLIENT_PORT}
    networks:
      - internal

secrets:
  remote_db_secret:
    file: remote_db.secret
  rtt_refresh_secret:
    file: rtt_refresh.secret

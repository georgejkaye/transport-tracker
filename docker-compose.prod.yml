networks:
  internal:
    external: false
services:
  api:
    build:
      context: api
      dockerfile: Dockerfile.prod
      args:
        VERSION: ${VERSION}
        POETRY_VERSION: ${POETRY_VERSION}
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      API_ENV: prod
      API_PORT: ${API_PORT}
      DATA_DIR: ${DATA_DIR}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: /run/secrets/db_secret
      DB_NAME: ${DB_NAME}
      TIMEZONE: ${TIMEZONE}
      VERSION: ${VERSION}
      NETWORK_PATH: /app/data/${NETWORK_FILE}
    volumes:
      - ${DATA_DIR}:/app/data
    networks:
      - internal
    secrets:
      - db_secret
      - natrail_secret
      - rtt_refresh_secret
  client:
    build:
      context: .
      dockerfile: client/Dockerfile.prod
      args:
        VERSION: ${VERSION}
        CLIENT_PORT: ${CLIENT_PORT}
        API_HOST: ${API_HOST}
        API_PROTOCOL: ${API_PROTOCOL}
        CLIENT_HOST: ${CLIENT_HOST}
        CLIENT_PROTOCOL: ${API_PROTOCOL}
        MAPTILER_KEY: ${MAPTILER_KEY}
        POETRY_VERSION: ${POETRY_VERSION}
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    environment:
      API_URL: ${API_PROTOCOL}://${API_HOST}
      CLIENT_PORT: ${CLIENT_PORT}
    networks:
      - internal
    depends_on:
      - api
secrets:
  db_secret:
    file: db.secret
  natrail_secret:
    file: natrail.secret
  rtt_refresh_secret:
    file: rtt_refresh.secret

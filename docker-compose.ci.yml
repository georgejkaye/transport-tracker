services:
  db_setup:
    build:
      context: db/setup
      dockerfile: Dockerfile
    environment:
      DB_HOST: ${CI_DB_HOST:?CI_DB_HOST must be set}
      DB_NAME: ${CI_DB_NAME:?CI_DB_NAME must be set}
      DB_USER: ${CI_DB_USER:?CI_DB_USER must be set}
      DB_PORT: ${CI_DB_PORT:-5432}
      DB_PASSWORD_SECRET_FILE: /run/secrets/remote_db_secret
    volumes:
      - ./db/.volume:/volume
    secrets:
      - remote_db_secret

  db:
    depends_on:
      db_setup:
        condition: service_completed_successfully
    build:
      context: db/db
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: transport
      POSTGRES_DB: transport
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD:?CI_DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/.volume:/docker-entrypoint-initdb.d
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 1s
      retries: 500
      start_period: 0s

  db_migrate:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: db
      dockerfile: migrate/Dockerfile
    environment:
      DB_PASSWORD_SECRET_FILE: /run/secrets/local_db_secret
    networks:
      - internal
    secrets:
      - local_db_secret

  api:
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    environment:
      DB_PASSWORD: /run/secrets/local_db_secret
    secrets:
      - local_db_secret

secrets:
  remote_db_secret:
    file: remote_db.secret
  local_db_secret:
    file: local_db.secret

volumes:
  pgdata:

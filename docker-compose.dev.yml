networks:
  internal:
    external: false
services:
  db_setup:
    build:
      context: db/setup
      dockerfile: Dockerfile
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PORT: ${DB_PORT:-5432}
      DB_PASSWORD_SECRET_FILE: /run/secrets/remote_db_secret
    volumes:
      - ./db/.volume:/volume
    secrets:
      - remote_db_secret

  db:
    depends_on:
      db_setup:
        condition: service_completed_successfully
    build:
      context: db/db
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: transport
      POSTGRES_DB: transport
      POSTGRES_PASSWORD_FILE: /run/secrets/local_db_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/.volume:/docker-entrypoint-initdb.d
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 1s
      retries: 500
      start_period: 0s
    secrets:
      - local_db_secret

  db_migrate:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: db
      dockerfile: migrate/Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: transport
      DB_USER: transport
      DB_PORT: 5432
      DB_PASSWORD_SECRET_FILE: /run/secrets/local_db_secret
    networks:
      - internal
    secrets:
      - local_db_secret

  codegen:
    image: georgejkaye/postgres-codegen:latest
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    environment:
      OUTPUT_MODULE_NAME: api.db
      WATCH_FILES: 1
      ROLL_SCRIPTS: 1
      DB_HOST: db
      DB_USER: transport
      DB_NAME: transport
      DB_PASSWORD_FILE: /run/secrets/local_db_secret
    volumes:
      - ./db/code:/app/input
      - ./api/src/api:/app/output
    networks:
      - internal
    secrets:
      - local_db_secret

  api:
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        POETRY_VERSION: 2.1.1
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      API_ENV: dev
      API_PORT: ${API_PORT}
      DATA_DIR: ${DATA_DIR}
      RTT_REFRESH_TOKEN_SECRET_FILE: /run/secrets/rtt_refresh_secret
      DB_HOST: db
      DB_USER: transport
      DB_PASSWORD: /run/secrets/local_db_secret
      DB_NAME: transport
      TIMEZONE: ${TIMEZONE}
      VERSION: ${VERSION:-0.0.1}
      NETWORK_PATH: /app/data/${NETWORK_FILE}
    volumes:
      - ./api/src:/app/src
      - ./api/data:/app/data
    secrets:
      - rtt_refresh_secret
      - local_db_secret
    networks:
      - internal
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail http://localhost:$$API_PORT/hc || exit 1"]
      interval: 1s
      timeout: 1s
      retries: 100
      start_period: 0s

  openapi:
    depends_on:
      api:
        condition: service_healthy
    build:
      context: openapi
      dockerfile: Dockerfile
    environment:
      OPENAPI_JSON_PATH: /app/input/openapi.json
      OPENAPI_TS_PATH: /app/output/api.d.ts
    volumes:
      - ./api/openapi:/app/input
      - ./client/src/app/api:/app/output

  client:
    depends_on:
      api:
        condition: service_healthy
    build:
      context: client
      dockerfile: Dockerfile.dev
      args:
        CLIENT_PORT: ${CLIENT_PORT}
        API_HOST: api:${API_PORT}
        API_PROTOCOL: http
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    environment:
      API_URL: "http://api:${API_PORT}"
      CLIENT_PORT: ${CLIENT_PORT}
      NEXT_PUBLIC_MAPTILER_KEY: ${MAPTILER_KEY}
    volumes:
      - ./client/src:/app/src
    networks:
      - internal

secrets:
  remote_db_secret:
    file: remote_db.secret
  local_db_secret:
    file: local_db.secret
  rtt_refresh_secret:
    file: rtt_refresh.secret

volumes:
  pgdata:

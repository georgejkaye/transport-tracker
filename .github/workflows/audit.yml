name: Check dependencies
on:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Submit bun lock dependencies
        uses: charpeni/bun-lock-submission@v1

name: Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_TOKEN }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.x

      - name: Get version
        id: version
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Check for data scripts
        id: data
        run: |
          if [ ! -d db/data ]; then
            echo "::error::db/data directory does not exist"
            exit 1
          fi
          sql_file=$(find db/data -maxdepth 1 -type f -name '*.sql' -print -quit)
          if [ -n "$sql_file" ]; then
            echo "has_db_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_db_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the docker image
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.KEY }}
          script_stop: true
          script: |
            cd ${{ vars.PROJECT_ROOT }}
            git pull
            VERSION=$(gitversion -showvariable FullSemVer) \
              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.deploy.yml up \
                --build \
                -d

      - name: Delete db data scripts
        if: steps.data.outputs.has_db_data == 'true'
        run: rm db/data/*.sql

      - name: Commit data script removal
        if: steps.data.outputs.has_db_data == 'true'
        uses: EndBug/add-and-commit@v11.1.1
        with:
          add: db/data
          message: "ci: remove rolled data scripts\n\n\nskip-checks: true"
          commit: "--cleanup=verbatim"
          tag: v${{ steps.version.outputs.fullSemVer }}
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"

      - name: Tag current commit
        if: steps.data.outputs.has_db_data == 'false'
        env:
          VERSION_TAG: v${{ steps.version.outputs.fullSemVer }}
        run: |
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.fullSemVer }}
          release_name: v${{ steps.version.outputs.fullSemVer }}

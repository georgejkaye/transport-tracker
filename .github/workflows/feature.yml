name: Feature branch build check

on:
  push:
    branches-ignore:
      - main

jobs:
  deploy:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Get current version
        id: version
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Make .env file
        run: |
          touch .env
          echo DATA_DIR=. >> .env
          echo DB_HOST=example.com >> .env
          echo DB_USER=transport >> .env
          echo DB_NAME=transport >> .env
          echo API_HOST=example.com >> .env
          echo API_PORT=8000 >> .env
          echo API_PROTOCOL=http >> .env
          echo TIMEZONE=Europe/London >> .env
          echo NETWORK_FILE=network.gml >> .env
          echo POETRY_VERSION=1.5.1 >> .env
          echo CLIENT_PORT=3000 >> .env
          echo CLIENT_PROTOCOL=http >> .env
          echo CLIENT_HOST=example.com >> .env
          echo MAPTILER_KEY=key >> .env
          echo VERSION=${{ steps.version.outputs.fullSemVer }} >> .env

      - name: Up docker containers
        id: up
        run: docker compose -f docker-compose.prod.yml up --build --wait

      - name: Print logs on error
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Down docker containers
        if: always()
        run: docker compose -f docker-compose.prod.yml down

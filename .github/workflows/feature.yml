name: Feature branch build check

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CI_DB_HOST: ${{ secrets.CI_DB_HOST }}
      CI_DB_NAME: ${{ secrets.CI_DB_NAME }}
      CI_DB_USER: ${{ secrets.CI_DB_USER }}
      CI_DB_PORT: ${{ secrets.CI_DB_PORT }}
      CI_LOCAL_DB_PASSWORD: ${{ secrets.CI_LOCAL_DB_PASSWORD }}
      CI_REMOTE_DB_PASSWORD: ${{ secrets.CI_REMOTE_DB_PASSWORD }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.8.x"

      - name: Get current version
        id: version
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Make .env file
        run: |
          touch .env
          echo DATA_DIR=. >> .env
          echo API_HOST=example.com >> .env
          echo API_PORT=8000 >> .env
          echo API_PROTOCOL=http >> .env
          echo TIMEZONE=Europe/London >> .env
          echo NETWORK_FILE=network.gml >> .env
          echo POETRY_VERSION=1.5.1 >> .env
          echo CLIENT_PORT=3000 >> .env
          echo CLIENT_PROTOCOL=http >> .env
          echo CLIENT_HOST=example.com >> .env
          echo MAPTILER_KEY=key >> .env
          echo VERSION=${{ steps.version.outputs.fullSemVer }} >> .env
          echo DB_HOST=db >> .env
          echo DB_NAME=transport >> .env
          echo DB_USER=transport >> .env

      - name: Make network file
        run: |
          echo "<graphml xmlns="http://graphml.graphdrawing.org/xmlns" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://graphml.graphdrawing.org/xmlns http://graphml.graphdrawing.org/xmlns/1.0/graphml.xsd"/>" >> network.gml

      - name: Prepare CI database credentials
        run: |
          : "${CI_DB_HOST:?Set the CI_DB_HOST GitHub secret}"
          : "${CI_DB_NAME:?Set the CI_DB_NAME GitHub secret}"
          : "${CI_DB_USER:?Set the CI_DB_USER GitHub secret}"
          : "${CI_LOCAL_DB_PASSWORD:?Set the CI_LOCAL_DB_PASSWORD GitHub secret}"
          : "${CI_REMOTE_DB_PASSWORD:?Set the CI_REMOTE_DB_PASSWORD GitHub secret}"
          printf '%s' "$CI_LOCAL_DB_PASSWORD" > local_db.secret
          printf '%s' "$CI_REMOTE_DB_PASSWORD" > remote_db.secret
          printf '%s' "$CI_RTT_REFRESH_TOKEN" > rtt_refresh.secret

      - name: Up docker containers
        id: up
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up --build --wait

      - name: Print logs
        if: always()
        run: ./ci/logs.sh

      - name: Down docker containers
        if: always() && steps.up.outcome != 'skipped'
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml down --volumes

      - name: Remove CI secret files
        if: always()
        run: |
          rm -f *.secret

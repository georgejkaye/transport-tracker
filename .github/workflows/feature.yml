name: Feature branch build check

on:
  push:
    branches-ignore:
      - main

jobs:
  deploy:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Get current version
        id: version
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Up docker containers
        id: up
        run: docker compose -f docker-compose.prod.yml up --build --wait
        env:
          DATA_DIR: .
          DB_HOST: example.com
          DB_USER: transport
          DB_NAME: transport
          API_HOST: example.com
          API_PORT: 8000
          API_PROTOCOL: http
          TIMEZONE: Europe/London
          NETWORK_FILE: network.gml
          POETRY_VERSION: 1.5.1
          CLIENT_PORT: 3000
          CLIENT_PROTOCOL: http
          CLIENT_HOST: example.com
          MAPTILER_KEY: key
          VERSION: ${{ steps.version.outputs.fullSemVer }}

      - name: Print logs on error
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Down docker containers
        if: always()
        run: docker compose -f docker-compose.prod.yml down
